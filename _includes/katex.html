<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.css">

<script
  data-cfasync="false"
  src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.js"></script>

<script
  data-cfasync="false"
  src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/contrib/auto-render.min.js"></script>

<script data-cfasync="false">
  (() => {
    let attempts = 0;

    const renderWikiMath = () => {
      const target =
        document.querySelector(".wiki-article__body") ||
        document.querySelector(".page-content");

      if (target && typeof window.renderMathInElement === "function") {
        window.renderMathInElement(target, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });

        return;
      }

      attempts += 1;

      if (attempts < 50) {
        window.setTimeout(renderWikiMath, 100);
      } else {
        console.error("KaTeX failed to load after five seconds.");
      }
    };

    renderWikiMath();
  })();
</script>
